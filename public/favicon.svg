<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" aria-hidden="true">
<style>
.fav-shine{transform:skewX(-18deg) translateX(0);animation:favShine 4.5s ease-in-out infinite}
@keyframes favShine{0%,70%{transform:skewX(-18deg) translateX(0)}100%{transform:skewX(-18deg) translateX(150px)}}
.fav-bg{animation:favBg 9s ease-in-out infinite}
@keyframes favBg{0%,100%{fill:#1F246C}33%{fill:#8639FA}66%{fill:#0F8AE5}}
.fav-cluster{animation:favCl 12s ease-in-out infinite}
@keyframes favCl{0%,100%{transform:translate(0,0)}25%{transform:translate(10px,8px)}50%{transform:translate(-8px,10px)}75%{transform:translate(-10px,-8px)}}
.fav-o1{animation:favO1 5s ease-in-out infinite,favO1op 9s ease-in-out infinite}
@keyframes favO1op{0%,66%,100%{opacity:0}33%{opacity:1}}
@keyframes favO1{0%,100%{transform:translate(0,0)}33%{transform:translate(4px,-3px)}66%{transform:translate(-2px,3px)}}
.fav-o2{animation:favO2 6s ease-in-out infinite,favO2op 9s ease-in-out infinite}
@keyframes favO2op{0%,33%,100%{opacity:0}66%{opacity:1}}
@keyframes favO2{0%,100%{transform:translate(0,0)}33%{transform:translate(-4px,3px)}66%{transform:translate(2px,-3px)}}
.fav-ow{animation:favOw 4.5s ease-in-out infinite}
@keyframes favOw{0%,100%{transform:translate(0,0)}33%{transform:translate(4px,4px)}66%{transform:translate(-3px,2px)}}
.fav-o3{animation:favO3 5.5s ease-in-out infinite,favO3op 9s ease-in-out infinite}
@keyframes favO3{0%,100%{transform:translate(0,0)}33%{transform:translate(4px,-3px)}66%{transform:translate(-3px,3px)}}
@keyframes favO3op{0%,100%{opacity:1}33%,66%{opacity:0}}
@media (prefers-reduced-motion: reduce){.fav-shine,.fav-bg,.fav-o1,.fav-o2,.fav-o3,.fav-ow,.fav-cluster{animation:none}}
</style>
  <defs>
    <linearGradient id="gL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8639FA"/>
      <stop offset="1" stop-color="#0F8AE5"/>
    </linearGradient>
    <linearGradient id="shineL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="aL">
      <path transform="translate(32 32) scale(1.1) translate(-32 -32)" d="M26.6 12h10.8l14.6 40h-10.4l-2.9-8.4H25.3L22.4 52H12zM27.9 36.2h8.2L32 23.8z" fill-rule="evenodd"/>
    </clipPath>
  <radialGradient id="o1L"><stop offset="0" stop-color="#B48DFF" stop-opacity="0.6"></stop><stop offset="0.5" stop-color="#B48DFF" stop-opacity="0.28"></stop><stop offset="1" stop-color="#B48DFF" stop-opacity="0"></stop></radialGradient><radialGradient id="o2L"><stop offset="0" stop-color="#5EC0FA" stop-opacity="0.6"></stop><stop offset="0.5" stop-color="#5EC0FA" stop-opacity="0.28"></stop><stop offset="1" stop-color="#5EC0FA" stop-opacity="0"></stop></radialGradient><clipPath id="bgcL"><rect width="64" height="64" rx="9"></rect></clipPath><radialGradient id="owL"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0.24"></stop><stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.1"></stop><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"></stop></radialGradient><radialGradient id="o3L"><stop offset="0" stop-color="#6F78E0" stop-opacity="0.6"></stop><stop offset="0.5" stop-color="#6F78E0" stop-opacity="0.28"></stop><stop offset="1" stop-color="#6F78E0" stop-opacity="0"></stop></radialGradient></defs>
  <rect class="fav-bg" width="64" height="64" rx="9" fill="#1F246C"/><g clip-path="url(#bgcL)"><g class="fav-cluster"><circle class="fav-o1" cx="26" cy="26" r="32" fill="url(#o1L)"></circle><circle class="fav-o2" cx="38" cy="36" r="30" fill="url(#o2L)"></circle><circle class="fav-o3" cx="30" cy="30" r="32" fill="url(#o3L)"></circle><circle class="fav-ow" cx="32" cy="22" r="18" fill="url(#owL)"></circle></g></g>
  <g clip-path="url(#aL)">
    <rect width="64" height="64" fill="#FFFFFF"/>
    <rect class="fav-shine" x="-40" y="0" width="28" height="64" fill="url(#shineL)"></rect>
  </g>
  
</svg>